<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — A Library of Every Kind of Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2541;
    --paper:#F3EBDA;
    --paper-light:#FBF7EE;
    --amber:#C8793A;
    --moss:#5C7A5D;
    --clay:#A6483C;
    --slate:#5C7E92;
    --rule:#DDD0B8;
    --ink-soft:#4A5478;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  .mono{font-family:'Space Mono', monospace;}

  /* ---------- HEADER ---------- */
  header.site{
    border-bottom:1px solid var(--rule);
    padding:22px 5vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:50;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.6rem;
    letter-spacing:0.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'Space Mono', monospace;
    font-size:0.65rem;
    border:1px solid var(--ink);
    padding:3px 6px;
    border-radius:2px;
    letter-spacing:0.08em;
    transform:translateY(-4px);
  }
  nav.site-nav{
    display:flex;
    align-items:center;
    gap:20px;
    flex:1;
    justify-content:flex-end;
    flex-wrap:wrap;
  }
  .search-wrap{
    display:flex;
    align-items:center;
    border-bottom:1.5px solid var(--ink);
    padding:6px 2px;
    min-width:220px;
    flex:1;
    max-width:340px;
  }
  .search-wrap input{
    border:none;
    background:none;
    outline:none;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    width:100%;
    color:var(--ink);
  }
  .search-wrap input::placeholder{color:var(--ink-soft);}
  .search-wrap svg{flex-shrink:0;margin-right:8px;}
  .nav-link{
    font-size:0.85rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border-bottom:1px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  .nav-link:hover{border-bottom-color:var(--ink);}

  /* ---------- MAIN ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:48px 5vw 90px;
    min-height:60vh;
  }

  /* ---------- HOME HERO ---------- */
  .hero{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:48px;
    align-items:end;
    padding-bottom:48px;
    border-bottom:1px solid var(--rule);
    margin-bottom:48px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:300;
    font-size:clamp(2.4rem, 5vw, 4.2rem);
    line-height:1.05;
    margin:0 0 18px;
    letter-spacing:-0.01em;
  }
  .hero h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--clay);
  }
  .hero p{
    color:var(--ink-soft);
    font-size:1.05rem;
    max-width:48ch;
    margin:0;
  }
  .hero-meta{
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:10px;
    border-left:1px solid var(--rule);
    padding-left:24px;
  }
  .hero-meta .big{
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }

  /* ---------- SECTION LABELS ---------- */
  .section-label{
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:28px;
  }
  .section-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* ---------- CATEGORY GRID ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
  }
  .cat-card{
    background:var(--paper-light);
    padding:24px;
    cursor:pointer;
    transition:background 0.18s ease;
    display:flex;
    flex-direction:column;
    gap:34px;
    min-height:150px;
    border-left:3px solid transparent;
  }
  .cat-card:hover{background:#fff;}
  .cat-card .code{
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    align-self:flex-end;
  }
  .cat-card .name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.25rem;
    line-height:1.2;
  }
  .cat-card .count{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  /* ---------- BOOK GRID (category page) ---------- */
  .book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:28px 22px;
  }
  .book-card{cursor:pointer;}
  .book-card .cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    background:var(--paper-light);
    border:1px solid var(--rule);
    margin-bottom:12px;
    display:block;
  }
  .book-card .title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.02rem;
    line-height:1.25;
    margin:0 0 4px;
  }
  .book-card .author{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .book-card .teaser{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 8px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .book-card .price{
    font-family:'Space Mono', monospace;
    font-size:0.85rem;
    font-weight:700;
  }

  /* ---------- CATEGORY HEADER ---------- */
  .cat-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:40px;
    padding-bottom:24px;
    border-bottom:1px solid var(--rule);
  }
  .cat-header h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(2rem, 4vw, 3rem);
    margin:0;
  }
  .cat-header .code-block{
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    color:var(--ink-soft);
    text-align:right;
  }
  .cat-header .code-block .code{
    font-size:1.4rem;
    color:var(--ink);
    display:block;
    margin-bottom:4px;
  }

  /* ---------- BOOK DETAIL ---------- */
  .breadcrumb{
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-bottom:32px;
    letter-spacing:0.04em;
  }
  .breadcrumb a:hover{color:var(--ink);}
  .book-detail{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:56px;
  }
  .book-detail .cover-wrap{position:relative;}
  .book-detail .cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border:1px solid var(--rule);
    display:block;
  }
  .book-detail .code-tag{
    position:absolute;
    top:-12px;
    left:-12px;
    background:var(--ink);
    color:var(--paper-light);
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    padding:5px 10px;
    letter-spacing:0.05em;
  }
  .book-detail .genre-tag{
    margin-top:16px;
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .book-detail h1{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(2rem, 4vw, 3rem);
    margin:0 0 6px;
    line-height:1.1;
  }
  .book-detail .by{
    font-size:1.05rem;
    color:var(--ink-soft);
    margin:0 0 28px;
  }
  .book-detail .lede{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.25rem;
    color:var(--ink);
    margin:0 0 24px;
    line-height:1.4;
  }
  .book-detail .summary{
    margin:0 0 32px;
    max-width:62ch;
    color:var(--ink-soft);
  }

  .sample-box{
    border:1px solid var(--rule);
    background:var(--paper-light);
    padding:28px 32px;
    margin-bottom:32px;
    position:relative;
  }
  .sample-box::before{
    content:'SAMPLE — FIRST PAGES';
    position:absolute;
    top:-10px;
    left:24px;
    background:var(--paper);
    padding:0 8px;
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .sample-box p{
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    line-height:1.7;
    margin:0;
    color:var(--ink);
  }
  .sample-box p:first-of-type::first-letter{
    font-size:2.6rem;
    font-weight:600;
    float:left;
    line-height:0.9;
    padding-right:8px;
    padding-top:4px;
    font-family:'Fraunces', serif;
  }
  .sample-fade{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--rule);
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
    letter-spacing:0.08em;
  }

  /* ---------- PURCHASE BLOCK ---------- */
  .purchase-block{
    border:1px solid var(--ink);
    padding:28px 32px;
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    align-items:center;
    justify-content:space-between;
  }
  .price-display{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .price-display .label{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--ink-soft);
  }
  .price-display .amount{
    font-family:'Fraunces', serif;
    font-size:2.1rem;
    font-weight:500;
  }
  .purchase-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    font-weight:600;
    letter-spacing:0.02em;
    padding:14px 26px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper-light);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .btn:hover{background:var(--clay); border-color:var(--clay);}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
  }
  .btn.secondary:hover{
    background:var(--ink);
    color:var(--paper-light);
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(28,37,65,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }
  .modal{
    background:var(--paper-light);
    border:1px solid var(--ink);
    max-width:440px;
    width:100%;
    padding:36px;
    position:relative;
  }
  .modal .close{
    position:absolute;
    top:16px;
    right:16px;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
    border:none;
    background:none;
  }
  .modal .close:hover{color:var(--ink);}
  .modal h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.5rem;
    margin:0 0 6px;
  }
  .modal .sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 24px;
  }
  .modal-row{
    display:flex;
    justify-content:space-between;
    font-size:0.9rem;
    padding:10px 0;
    border-bottom:1px solid var(--rule);
  }
  .modal-row.total{
    font-weight:700;
    font-family:'Space Mono', monospace;
    border-bottom:none;
    padding-top:14px;
  }
  .modal label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:18px 0 6px;
  }
  .modal input[type=number], .modal input[type=email]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--rule);
    background:#fff;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    outline:none;
  }
  .modal input:focus{border-color:var(--ink);}
  .amount-options{
    display:flex;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .amount-options button{
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    padding:8px 14px;
    border:1px solid var(--rule);
    background:#fff;
    cursor:pointer;
  }
  .amount-options button.active{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper-light);
  }
  .modal .btn{width:100%; margin-top:22px; text-align:center;}
  .pay-methods{
    display:flex;
    gap:8px;
    margin-top:14px;
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .pay-methods span{
    border:1px solid var(--rule);
    padding:3px 8px;
  }
  .success-icon{
    width:48px;height:48px;border:1.5px solid var(--moss);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;color:var(--moss);font-size:1.4rem;
  }
  .download-link{
    display:block;
    border:1px dashed var(--ink);
    padding:14px;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:0.85rem;
    margin-top:18px;
    color:var(--ink);
  }

  /* ---------- FOOTER ---------- */
  footer.site{
    border-top:1px solid var(--rule);
    padding:32px 5vw;
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .hero{grid-template-columns:1fr; gap:24px;}
    .hero-meta{border-left:none; border-top:1px solid var(--rule); padding-left:0; padding-top:18px; flex-direction:row; flex-wrap:wrap; gap:24px;}
    .book-detail{grid-template-columns:1fr;}
    .book-detail .cover-wrap{max-width:240px;}
    .purchase-block{flex-direction:column; align-items:stretch;}
    .purchase-actions{flex-direction:column;}
    .btn{width:100%;}
  }

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, .cat-card:focus-visible, .book-card:focus-visible{
    outline:2px solid var(--clay);
    outline-offset:2px;
  }
  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.2rem;
  }
</style>
</head>

<main id="app"></main>

    ['Ironroot Vol. 1','Studio Kindred',1500],
    ['The Last Signal','Maya Okonjo',1600],
    ['Paper Moons','Devon Aiyegbusi',1400],
  ]},
];

// Build a flat, indexable book list with ids and derived copy
const BOOKS = [];
CATEGORIES.forEach((cat, ci) => {
  cat.accent = ACCENTS[ci % ACCENTS.length];
  cat.books = cat.books.map((b, bi) => {
    const id = `${cat.slug}-${bi}`;
    const [title, author, price] = b;
    const book = {
      id, title, author, price,
      category: cat.name,
      catSlug: cat.slug,
      code: cat.code,
      accent: cat.accent,
      cover: `https://picsum.photos/seed/${id}/400/600`,
      teaser: teaserFor(cat.name, title),
      summary: summaryFor(cat.name, title, author),
      sample: sampleFor(title, author),
    };
    BOOKS.push(book);
    return book;
  });
});

function teaserFor(genre, title){
  const T = {
    'Fiction':`A character study that lingers — quiet, observant, and quietly devastating.`,
    'Non-Fiction':`A clear-eyed look at a subject most of us only half-understand.`,
    'Romance':`Two people, one impossible timing, and a slow-burn worth waiting for.`,
    'Mystery & Thriller':`Every answer raises two more questions — and the clock keeps moving.`,
    'Science Fiction':`A near-future world that feels uncomfortably close to our own.`,
    'Fantasy':`A richly built world where the rules of magic come with a real cost.`,
    'Horror':`Slow dread, built room by room, until there's nowhere left to look.`,
    'Biography & Memoir':`An honest account of a life shaped by ordinary, extraordinary choices.`,
    'Self-Help & Personal Development':`Practical, unfussy guidance for people tired of empty advice.`,
    'Business & Finance':`Straight talk on money and decision-making, without the jargon.`,
    'History':`A forgotten chapter, brought back with care and sharp research.`,
    'Religion & Spirituality':`A gentle companion for anyone looking for steadier ground.`,
    'Health & Wellness':`Small, sustainable changes explained without hype or guilt.`,
    "Children's Books":`A warm, read-aloud story built for bedtime and beyond.`,
    'Young Adult':`Coming-of-age, told with humour, ache, and real stakes.`,
    'Poetry':`Short, sharp lines that reward reading twice.`,
    'Education & Academic':`A clear framework for thinking and studying better.`,
    'Cookbooks & Food':`Recipes built for real kitchens and real schedules.`,
    'Travel & Adventure':`A journey told in small, vivid details.`,
    'Comics & Graphic Novels':`Bold art and a story that moves fast.`,
  };
  return T[genre] || `A standout addition to the ${genre} shelf.`;
}

function summaryFor(genre, title, author){
  return `In “${title},” ${author} brings a distinctive voice to the ${genre.toLowerCase()} shelf. `
       + `The book moves at a confident pace, balancing character, detail, and momentum in a way that rewards readers who like to sit with a story rather than rush it. `
       + `Whether read in one sitting or a chapter at a time, it's the kind of book that's easy to recommend and hard to forget.`;
}

function sampleFor(title, author){
  return [
    `The morning had a way of arriving before anyone was ready for it. Outside, the street was still half-asleep — shutters down, a single generator humming somewhere out of sight — and inside, the pages of "${title}" were already waiting, dog-eared at the corner where the story properly begins.`,
    `${author} doesn't rush the opening. There's a patience here, a sense that every detail will eventually matter, and that the reader is in good hands. By the end of this first chapter, the world feels lived-in — familiar enough to trust, unfamiliar enough to keep turning the page.`
  ];
}

/* =========================================================
   ROUTER
   ========================================================= */
function navigate(route, payload){
  let hash = '#/';
  if(route === 'category') hash = `#/category/${payload}`;
  if(route === 'book') hash = `#/book/${payload}`;
  window.location.hash = hash;
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  render();
  document.getElementById('searchInput').addEventListener('input', onSearch);
});

function onSearch(e){
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(); return; }

  const app = document.getElementById('app');
  const results = BOOKS.filter(b =>
    b.title.toLowerCase().includes(q) ||
    b.author.toLowerCase().includes(q) ||
    b.category.toLowerCase().includes(q)
  );

  app.innerHTML = `
    <div class="section-label">SEARCH RESULTS FOR “${escapeHtml(e.target.value)}”</div>
    ${results.length ? `<div class="book-grid">${results.map(bookCard).join('')}</div>`
                      : `<div class="empty-state">Nothing on the shelf matches that search.</div>`}
  `;
  bindBookCards();
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');
  document.getElementById('searchInput').value = '';

  if(hash.startsWith('#/category/')){
    const slug = hash.split('/')[2];
    renderCategory(app, slug);
  } else if(hash.startsWith('#/book/')){
    const id = hash.split('/')[2];
    renderBook(app, id);
  } else {
    renderHome(app);
  }
  window.scrollTo(0,0);
}

function renderHome(app){
  const totalBooks = BOOKS.length;
  app.innerHTML = `
    <section class="hero">
      <div>
        <h1>A reading room for <em>every</em> kind of story.</h1>
        <p>Browse twenty sections, read a free sample from any title, and pay only when you've found the book you want to keep. Card, bank transfer, USSD — or a donation, if you'd rather support the shelf than buy a single book.</p>
      </div>
      <div class="hero-meta">
        <div>
          <div class="big">${CATEGORIES.length}</div>
          <div>SECTIONS CATALOGUED</div>
        </div>
        <div>
          <div class="big">${totalBooks}</div>
          <div>TITLES AVAILABLE</div>
        </div>
      </div>
    </section>

    <div class="section-label">BROWSE THE SHELVES</div>
    <div class="cat-grid">
      ${CATEGORIES.map(catCard).join('')}
    </div>
  `;
  document.querySelectorAll('.cat-card').forEach(el=>{
    el.addEventListener('click', () => navigate('category', el.dataset.slug));
    el.setAttribute('tabindex','0');
    el.addEventListener('keypress', e=>{ if(e.key==='Enter') navigate('category', el.dataset.slug); });
  });
}

function catCard(cat){
  return `
    <div class="cat-card" data-slug="${cat.slug}" style="border-left-color:var(--${cat.accent})">
      <div class="code mono">${cat.code}</div>
      <div>
        <div class="name">${cat.name}</div>
        <div class="count">${cat.books.length} TITLES</div>
      </div>
    </div>
  `;
}

function renderCategory(app, slug){
  const cat = CATEGORIES.find(c => c.slug === slug);
  if(!cat){ app.innerHTML = `<div class="empty-state">That section couldn't be found.</div>`; return; }

  app.innerHTML = `
    <div class="breadcrumb"><a href="#/" onclick="navigate('home')">Catalog</a> &nbsp;/&nbsp; ${cat.name}</div>
    <div class="cat-header">
      <h2>${cat.name}</h2>
      <div class="code-block">
        <span class="code mono">${cat.code}</span>
        ${cat.books.length} titles in this section
      </div>
    </div>
    <div class="book-grid">
      ${cat.books.map(bookCard).join('')}
    </div>
  `;
  bindBookCards();
}

function bookCard(book){
  return `
    <div class="book-card" data-id="${book.id}" tabindex="0">
      <img class="cover" src="${book.cover}" alt="Cover of ${book.title}" loading="lazy">
      <div class="title">${book.title}</div>
      <div class="author">${book.author}</div>
      <div class="teaser">${book.teaser}</div>
      <div class="price mono">₦${book.price.toLocaleString()}</div>
    </div>
  `;
}

function bindBookCards(){
  document.querySelectorAll('.book-card').forEach(el=>{
    el.addEventListener('click', () => navigate('book', el.dataset.id));
    el.addEventListener('keypress', e=>{ if(e.key==='Enter') navigate('book', el.dataset.id); });
  });
}

function renderBook(app, id){
  const book = BOOKS.find(b => b.id === id);
  if(!book){ app.innerHTML = `<div class="empty-state">That title couldn't be found.</div>`; return; }

  app.innerHTML = `
    <div class="breadcrumb">
      <a href="#/" onclick="navigate('home')">Catalog</a> &nbsp;/&nbsp;
      <a href="#/category/${book.catSlug}" onclick="navigate('category','${book.catSlug}')">${book.category}</a> &nbsp;/&nbsp;
      ${book.title}
    </div>
    <div class="book-detail">
      <div>
        <div class="cover-wrap">
          <div class="code-tag mono">${book.code}</div>
          <img class="cover" src="${book.cover}" alt="Cover of ${book.title}">
        </div>
        <div class="genre-tag">${book.category}</div>
      </div>
      <div>
        <h1>${book.title}</h1>
        <p class="by">by ${book.author}</p>
        <p class="lede">${book.teaser}</p>
        <p class="summary">${book.summary}</p>

        <div class="sample-box">
          ${book.sample.map(p=>`<p>${p}</p>`).join('')}
          <div class="sample-fade">— END OF FREE SAMPLE —</div>
        </div>

        <div class="purchase-block">
          <div class="price-display">
            <div class="label">Full book — PDF / EPUB</div>
            <div class="amount mono">₦${book.price.toLocaleString()}</div>
          </div>
          <div class="purchase-actions">
            <button class="btn secondary" onclick="openModal('donate','${book.id}')">Support &amp; Download</button>
            <button class="btn" onclick="openModal('buy','${book.id}')">Buy &amp; Download</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   PAYMENT MODAL (placeholder — wire up Paystack/Flutterwave here)
   ========================================================= */
function openModal(type, bookId){
  const book = BOOKS.find(b => b.id === bookId);
  const root = document.getElementById('modalRoot');

  if(type === 'buy'){
    root.innerHTML = `
      <div class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
          <button class="close" onclick="closeModal()">CLOSE ✕</button>
          <h3>Checkout</h3>
          <p class="sub">${book.title} — ${book.author}</p>
          <div class="modal-row"><span>Item price</span><span class="mono">₦${book.price.toLocaleString()}</span></div>
          <div class="modal-row total"><span>Total due</span><span class="mono">₦${book.price.toLocaleString()}</span></div>
          <label for="emailBuy">Email (for your download link)</label>
          <input type="email" id="emailBuy" placeholder="you@email.com">
          <div class="pay-methods"><span>CARD</span><span>BANK TRANSFER</span><span>USSD</span></div>
          <button class="btn" onclick="simulatePayment('${book.id}', ${book.price})">Pay ₦${book.price.toLocaleString()} with Paystack</button>
        </div>
      </div>
    `;
  } else {
    root.innerHTML = `
      <div class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
          <button class="close" onclick="closeModal()">CLOSE ✕</button>
          <h3>Support this title</h3>
          <p class="sub">${book.title} — ${book.author}</p>
          <p style="font-size:0.9rem; color:var(--ink-soft); margin:0 0 8px;">
            Pay what you'd like. The recommended price is ₦${book.price.toLocaleString()}, with a minimum of ₦200.
          </p>
          <div class="amount-options" id="amountOptions">
            ${[200,500,1000,book.price].map((v,i)=>`<button data-amt="${v}" class="${i===3?'active':''}" onclick="selectAmount(this)">₦${v.toLocaleString()}</button>`).join('')}
          </div>
          <label for="customAmt">Or enter your own amount</label>
          <input type="number" id="customAmt" min="200" placeholder="e.g. 750" oninput="clearAmountSelection()">
          <label for="emailDonate">Email (for your download link)</label>
          <input type="email" id="emailDonate" placeholder="you@email.com">
          <div class="pay-methods"><span>CARD</span><span>BANK TRANSFER</span><span>USSD</span></div>
          <button class="btn" id="donateBtn" onclick="simulateDonation('${book.id}')">Pay &amp; Download</button>
        </div>
      </div>
    `;
  }
}

function selectAmount(btn){
  document.querySelectorAll('#amountOptions button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customAmt').value = '';
}
function clearAmountSelection(){
  document.querySelectorAll('#amountOptions button').forEach(b=>b.classList.remove('active'));
}

function simulatePayment(bookId, amount){
  showSuccess(bookId, amount);
}

function simulateDonation(bookId){
  const active = document.querySelector('#amountOptions button.active');
  const custom = document.getElementById('customAmt').value;
  let amount = custom ? Number(custom) : (active ? Number(active.dataset.amt) : 0);
  if(!amount || amount < 200){
    alert('Please choose or enter an amount of at least ₦200.');
    return;
  }
  showSuccess(bookId, amount);
}

function showSuccess(bookId, amount){
  const book = BOOKS.find(b => b.id === bookId);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModalOnOverlay(event)">
      <div class="modal">
        <button class="close" onclick="closeModal()">CLOSE ✕</button>
        <div class="success-icon">✓</div>
        <h3>Payment received</h3>
        <p class="sub">₦${amount.toLocaleString()} — ${book.title}</p>
        <p style="font-size:0.9rem; color:var(--ink-soft);">
          In the live site, this is where a secure, time-limited download link is generated and emailed to the buyer.
        </p>
        <a class="download-link" href="#" onclick="alert('This would trigger the real PDF/EPUB download.'); return false;">⬇ DOWNLOAD “${book.title.toUpperCase()}” (PDF)</a>
      </div>
    </div>
  `;
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
function closeModalOnOverlay(e){
  if(e.target.classList.contains('modal-overlay')) closeModal();
}
</script>
</body>
</html>
